# Builds an installable Android app (Pace.apk) on every push to main and attaches it to a GitHub
# Release. Open the repo's Releases page on your phone, download Pace.apk and tap it to install.
#
# This build is signed with React Native's debug key: fine for your own phone, not for the Play Store.
# Store builds go through EAS (see README, step 3).
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Test the training engine
        run: npm test

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Pace.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pace for Android (build ${{ github.run_number }})
          body: Download Pace.apk on your phone and tap it to install.
          files: Pace.apk
          make_latest: true
